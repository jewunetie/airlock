name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('airlock.py') }}
          restore-keys: |
            hf-models-

      - name: Packaging, CLI, console and measurement checks
        run: |
          uv run python - <<'PYTHON'
          import test
          for fn in (test.test_packaging, test.test_cli, test.test_console, test.test_measurements):
              result = fn()
              assert not result.unavailable, result.unavailable
              print(f"{fn.__name__}: {len(result.passed)} passed")
          PYTHON

      - name: Guard, reassembly and MCP checks
        run: |
          uv run python - <<'PYTHON'
          import test
          for fn in (test.test_guard, test.test_round_guard, test.test_cross_round, test.test_server):
              result = fn()
              assert not result.unavailable, result.unavailable
              print(f"{fn.__name__}: {len(result.passed)} passed")
          PYTHON

      # Hosted runners lack Ollama. Report that gap; never hide a real failure.
      - name: Worker checks (inconclusive without Ollama)
        run: |
          uv run python - <<'PYTHON'
          import test
          for fn in (test.test_doctor, test.test_worker, test.test_tax):
              result = fn()
              print(f"{fn.__name__}: {len(result.passed)} passed, {len(result.unavailable)} unavailable")
              for name, reason in result.unavailable:
                  print(f"INCONCLUSIVE: {name}: {reason}")
          PYTHON

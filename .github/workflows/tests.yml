name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked

      # Synthetic data and scripted model responses; no claim of live scanner,
      # Ollama, calibration, or OS confinement acceptance.
      - name: Retry, release, storage, Coder, CLI and MCP contracts
        run: uv run --locked python -B -m pytest -q test.py

      - name: Build the single-module distribution
        run: |
          uv build --out-dir dist
          uv run --locked python - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          from tarfile import open as open_tar
          wheel, = Path('dist').glob('airlock-*.whl')
          with ZipFile(wheel) as archive:
              assert [name for name in archive.namelist() if name.endswith('.py')] == ['airlock.py']
          sdist, = Path('dist').glob('airlock-*.tar.gz')
          with open_tar(sdist) as archive:
              assert not any('new_design/' in name for name in archive.getnames())
          PYTHON

      - name: Verify installed wheel entry point
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/airlock-*.whl
          .venv/bin/airlock --help

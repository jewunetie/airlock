[project]
name = "airlock"
dynamic = ["version"]
description = "A local workspace agent with a separate fail-closed disclosure boundary."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Kept in exact sync with the PEP 723 header at the top of airlock.py.
# test.py asserts the two lists agree; see AGENTS.md for why
# this is a checked invariant rather than a single source of truth.
dependencies = [
    "torch>=2.13.0,<2.14.0",
    "transformers>=5.15.0,<5.16.0",
    "pypdf>=6.16.1,<7",
    "pydantic-ai-slim[openai]>=2.46.0,<2.47.0",
    "pydantic>=2.13.4,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "filelock>=3.32.3,<4",
    "httpx>=0.28.1,<0.29",
    "platformdirs>=4.12.1,<5",
    "psutil>=7.2.2,<8",
    "opentelemetry-sdk>=1.45,<1.46",
    "pydantic-ai-harness>=0.36,<0.37",
    "fastmcp>=4.0.10,<4.1",
    "fastmcp-tasks>=4.0.10,<4.1",
    "uvicorn>=0.52.4,<0.55",
    "presidio-analyzer>=2.2.364,<2.3",
    "pillow>=12.3,<13",
    "textual>=8.2.8,<8.3",
]

[project.urls]
Homepage = "https://github.com/jewunetie/airlock"
Repository = "https://github.com/jewunetie/airlock"

[project.scripts]
airlock = "airlock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# airlock is one module, not a package: this tells hatchling to build a
# wheel around airlock.py directly instead of expecting a directory.
[tool.hatch.build.targets.wheel]
only-include = ["airlock.py"]

[tool.hatch.build.targets.sdist]
only-include = ["airlock.py", "pyproject.toml", "README.md", "LICENSE"]

# Reads __version__ out of airlock.py instead of duplicating it here, so
# there is exactly one version number in the repository, not two that can
# drift apart the way the dependency lists can.
[tool.hatch.version]
path = "airlock.py"

[tool.pytest.ini_options]
python_files = ["test.py"]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
]
